services:
  valkey:
    image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    container_name: lazydb-valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - lazydb-valkey-data:/data
    command: ["valkey-server", "--appendonly", "yes", "--databases", "4"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lazydb-valkey-data:
