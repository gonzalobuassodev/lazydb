name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows installer (PowerShell)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Show PowerShell version
        shell: powershell
        run: '$PSVersionTable | Out-String | Write-Host'
      - name: Test Windows installer behavior
        shell: powershell
        run: ./scripts/release/test-windows-installer.ps1 -AllowUserPathMutation

  windows-installer-pwsh:
    name: Windows installer (pwsh)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Show PowerShell version
        shell: pwsh
        run: '$PSVersionTable | Out-String | Write-Host'
      - name: Test Windows installer behavior
        shell: pwsh
        run: ./scripts/release/test-windows-installer.ps1 -AllowUserPathMutation

  distribution:
    name: Distribution contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.94.0 --profile minimal --no-self-update
      - run: rustup default 1.94.0
      - run: sh scripts/release/test-distribution.sh
      - name: Require native Linux ELF scan and strip test
        run: |
          python3 -B scripts/release/test-linux-runtime.py
          python3 -B -c 'import unittest, sys; sys.path.insert(0, "scripts/release"); from test_linux_runtime import LinuxElfIntegrationTests; suite=unittest.defaultTestLoader.loadTestsFromTestCase(LinuxElfIntegrationTests); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful() or result.skipped != [])'

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Select Rust
        run: rustup default 1.94.0
      - name: Limit Cargo build footprint
        shell: bash
        run: |
          {
            echo 'CARGO_INCREMENTAL=0'
            echo 'CARGO_BUILD_JOBS=1'
          } >> "$GITHUB_ENV"
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-deps-
      - run: cargo +1.94.0 fmt --all -- --check
      - run: cargo +1.94.0 clippy --all-targets --all-features -- -D warnings
      - run: cargo +1.94.0 test --all-targets --all-features
      - name: Check macOS binary dependencies
        if: runner.os == 'macOS'
        run: |
          cargo +1.94.0 build --locked
          sh scripts/release/check-macos-dependencies.sh target/debug/lazydb

  databases:
    name: PostgreSQL, MySQL, and SQL Server adapters
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lazydb_test
          POSTGRES_DB: lazydb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lazydb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: lazydb_test
          MYSQL_DATABASE: lazydb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -plazydb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: lazydb_test
          MARIADB_DATABASE: lazydb_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -plazydb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: LazydbC1!SqlServer2022
        ports:
          - 1433:1433
        options: >-
          --platform linux/amd64
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LAZYDB_TEST_POSTGRES_URL: postgresql://postgres:lazydb_test@127.0.0.1:5432/lazydb_test
      LAZYDB_TEST_MYSQL_URL: mysql://root:lazydb_test@127.0.0.1:3306/lazydb_test
      LAZYDB_TEST_MARIADB_URL: mariadb://root:lazydb_test@127.0.0.1:3307/lazydb_test
      LAZYDB_TEST_SQLSERVER_URL: sqlserver://sa:LazydbC1!SqlServer2022@127.0.0.1:1433/tempdb?encrypt=false
      LAZYDB_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.94.0 --profile minimal --no-self-update
      - run: rustup default 1.94.0
      - name: PostgreSQL adapter tests
        run: timeout 10m cargo test --locked --test postgres_adapter -- --nocapture --test-threads=1
      - name: PostgreSQL principal permission tests
        run: timeout 10m env LAZYDB_REQUIRE_DATABASE_TESTS=1 cargo test --locked --test postgres_principal_mutations -- --nocapture --test-threads=1
      - name: MySQL adapter tests
        run: timeout 10m env LAZYDB_REQUIRE_DATABASE_TESTS=1 cargo test --locked --test mysql_adapter -- --nocapture --test-threads=1
      - name: MariaDB adapter tests
        run: timeout 10m env LAZYDB_REQUIRE_DATABASE_TESTS=1 LAZYDB_TEST_MYSQL_FUNCTIONAL_INDEX=0 LAZYDB_TEST_MYSQL_URL="$LAZYDB_TEST_MARIADB_URL" cargo test --locked --test mariadb_profile --test mariadb_adapter --test mariadb_catalog --test mariadb_values --test mariadb_transactions --test mariadb_relation_mutations --test mariadb_catalog_mutation --test mariadb_programmable_objects --test mariadb_temporal --test mariadb_connection --test mariadb_monitoring --test mariadb_principals --test mariadb_sql -- --nocapture --test-threads=1
      - name: MariaDB relation mutation library tests
        run: timeout 10m env LAZYDB_REQUIRE_DATABASE_TESTS=1 LAZYDB_TEST_MARIADB_URL="$LAZYDB_TEST_MARIADB_URL" cargo test --locked --lib mariadb_ -- --nocapture --test-threads=1
      - name: SQL Server adapter tests
        run: timeout 10m cargo test --locked --test sqlserver_adapter -- --nocapture --test-threads=1
      - name: SQL Server transaction tests
        run: timeout 10m cargo test --locked --test sqlserver_transactions -- --nocapture --test-threads=1
      - name: Redis mutation tests
        run: timeout 10m cargo test --locked --test redis_mutation -- --ignored --nocapture --test-threads=1
